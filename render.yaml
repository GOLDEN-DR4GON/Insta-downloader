services:
  - type: web
    name: instagram-downloader
    env: node
    plan: free
    buildCommand: |
      apt-get update --allow-releaseinfo-change || true
      apt-get install -y python3-pip --no-install-recommends || true
      pip3 install yt-dlp --no-cache-dir || true
      npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
